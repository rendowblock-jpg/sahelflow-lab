name: smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag of rendowblock-jpg/sahelflow_v2 (empty = latest)"
        required: false
        default: ""
  push:
    branches: ["run/**"]
permissions:
  contents: write
concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Read run request
        id: req
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ -f runs/current.json ]; then TAG=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("runs/current.json","utf8")).release_tag||"")'); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "request: ok"
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errs = $null; $tok = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tok, [ref]$errs)
            if ($errs.Count -gt 0) { $bad++; Write-Host "lint: fail $($_.Name): $($errs[0].Message) line $($errs[0].Extent.StartLineNumber)" }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "lint: ok"
      - name: Probe machine
        shell: pwsh
        run: ./scripts/probe-machine.ps1
      - name: Install lab tools
        run: |
          npm install --no-audit --no-fund --silent
          echo "tools: ok"
      - name: Fetch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-release.sh "${{ steps.req.outputs.tag }}"
      - name: Install MSI
        shell: pwsh
        run: ./scripts/install-msi.ps1
      - name: Disk benchmark
        shell: pwsh
        run: ./scripts/disk-bench.ps1
      - name: Launch and observe
        shell: pwsh
        run: ./scripts/launch-observe.ps1
      - name: Pack and encrypt results
        if: always()
        run: bash scripts/pack-encrypt.sh
      - name: Upload encrypted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-results-${{ github.run_id }}
          path: out/results.enc
          retention-days: 14
      - name: Publish encrypted results as a release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "run-${{ github.run_id }}" out/results.enc --title "run-${{ github.run_id }}" --notes "encrypted lab results" --prerelease --target "$GITHUB_SHA" && echo "release: ok" || echo "release: fail"
