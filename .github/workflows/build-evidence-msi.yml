name: build-evidence-msi
# Builds the product at a chosen commit into an unsigned MSI whose WebView exposes a debug port on 127.0.0.1:9222,
# compiled against a loopback trial issuer (127.0.0.1:8787) and the repo's CI trial keys. Started by pushing a branch build/**.
on:
  workflow_dispatch:
  push:
    branches: ["build/**"]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Declared differences from the release build: the product's own explicit evidence-build marker (build.rs accepts a
      # single loopback issuer only with it), a loopback trial issuer, CI trial keys, a WebView debug port (see inject script).
      SF_PHASE4_RESTORE_EVIDENCE_BUILD: "1"
      SF_LICENSE_SERVICE_URL: "http://127.0.0.1:8787"
      SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ="}'
      SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
    steps:
      - uses: actions/checkout@v4
      - name: Read build request
        id: req
        shell: bash
        run: |
          echo "repo=$(node -p 'require("./builds/request.json").repo')" >> "$GITHUB_OUTPUT"
          echo "ref=$(node -p 'require("./builds/request.json").ref')" >> "$GITHUB_OUTPUT"
          echo "port=$(node -p 'require("./builds/request.json").debug_port')" >> "$GITHUB_OUTPUT"
          echo "request: ok"
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errs = $null; $tok = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tok, [ref]$errs)
            if ($errs.Count -gt 0) { $bad++; Write-Host "lint: fail $($_.Name): $($errs[0].Message) line $($errs[0].Extent.StartLineNumber)" }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "lint: ok"
      - name: Check out the product at the requested commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.req.outputs.repo }}
          ref: ${{ steps.req.outputs.ref }}
          path: product
          persist-credentials: false
      - name: Install bun 1.3.14
        shell: bash
        run: |
          npm install -g bun@1.3.14 --silent
          bun --version
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            product/src-tauri/target
          key: ${{ runner.os }}-cargo-lab-${{ hashFiles('product/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lab-
      - name: Install frozen dependencies
        shell: bash
        working-directory: product
        run: bun install --frozen-lockfile --linker=hoisted
      - name: Prepare libsodium, runtime and sidecar
        shell: pwsh
        working-directory: product
        run: |
          ./scripts/prepare-libsodium-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'libsodium prepare failed' }
          bun run scripts/prepare-runtime.ts
          if ($LASTEXITCODE -ne 0) { throw 'runtime prepare failed' }
          bun run build:sidecar
          if ($LASTEXITCODE -ne 0) { throw 'sidecar build failed' }
      - name: Write evidence Tauri config
        shell: pwsh
        run: ./scripts/inject-evidence-config.ps1 -ProductDir product -DebugPort ${{ steps.req.outputs.port }}
      - name: Build unsigned evidence MSI
        shell: pwsh
        working-directory: product
        run: |
          Remove-Item -LiteralPath 'src-tauri/target/release/bundle/msi' -Recurse -Force -ErrorAction SilentlyContinue
          & bunx tauri build --bundles msi --config .sf-lab-tauri.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $m = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          Write-Host "build: ok ($($m.Name), $([math]::Round($m.Length/1MB,1)) MB)"
      - name: Collect build facts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/msi | Out-Null
          Copy-Item product/src-tauri/target/release/bundle/msi/*.msi out/msi/
          [ordered]@{ repo = '${{ steps.req.outputs.repo }}'; ref = '${{ steps.req.outputs.ref }}'; debugPort = ${{ steps.req.outputs.port }}; runId = '${{ github.run_id }}' } | ConvertTo-Json | Set-Content out/msi/build-facts.json
          Copy-Item product/scripts/phase4-ci-trial-issuer.mjs out/msi/ -ErrorAction SilentlyContinue
          Write-Host "facts: ok"
      - name: Upload evidence MSI
        uses: actions/upload-artifact@v4
        with:
          name: evidence-msi-${{ github.run_id }}
          path: out/msi
          retention-days: 14
