name: Windows Rust release parity
# LAB ONLY. The name is the one product/src-tauri/build.rs accepts, together with the placeholder licence URL and test keys below, for a
# release-profile build in CI (the product's own release check does the same). It lets the lab time the card in a release build.
# Paints the product's REAL startup card on a Windows runner (the same GDI+ code a seller sees) for several looks, languages
# and progress values, and uploads the raw pixels. No installer, no app run: about a third of the time of build-evidence-msi.
# Started by pushing a branch card/**. The product commit comes from builds/card-request.json.
on:
  workflow_dispatch:
  push:
    branches: ["card/**"]
permissions:
  contents: read
concurrency:
  group: card-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_LICENSE_SERVICE_URL: "https://license.invalid"
      SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        shell: bash
        run: |
          echo "repo=$(node -p 'require("./builds/card-request.json").repo')" >> "$GITHUB_OUTPUT"
          echo "ref=$(node -p 'require("./builds/card-request.json").ref')" >> "$GITHUB_OUTPUT"
          echo "profile=$(node -p '(require("./builds/card-request.json").profile||"dev")')" >> "$GITHUB_OUTPUT"
          echo "request: ok"
      - name: Check out the product
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.req.outputs.repo }}
          ref: ${{ steps.req.outputs.ref }}
          path: product
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            product/src-tauri/target
          key: ${{ runner.os }}-cargo-card-${{ steps.req.outputs.profile }}-${{ hashFiles('product/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-card-${{ steps.req.outputs.profile }}-
      - name: Prepare what the product test build needs (same steps as its Windows Rust parity workflow)
        shell: pwsh
        working-directory: product
        run: |
          bun run scripts/sync-cargo-root-lock.ts
          if ($LASTEXITCODE -ne 0) { throw 'sync failed' }
          bun install --frozen-lockfile --linker=hoisted
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          bunx prisma generate
          if ($LASTEXITCODE -ne 0) { throw 'prisma failed' }
          bun run scripts/prepare-runtime.ts
          if ($LASTEXITCODE -ne 0) { throw 'runtime failed' }
          bun run build:sidecar
          if ($LASTEXITCODE -ne 0) { throw 'sidecar failed' }
          ./scripts/prepare-libsodium-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'libsodium failed' }
      - name: Build the test binary
        shell: pwsh
        working-directory: product
        env:
          PROFILE_FLAG: ${{ steps.req.outputs.profile == 'release' && '--release' || '' }}
        run: |
          $extra = @(); if ($env:PROFILE_FLAG) { $extra = @($env:PROFILE_FLAG) }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked @extra --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Paint the card
        shell: pwsh
        working-directory: product
        env:
          PROFILE_FLAG: ${{ steps.req.outputs.profile == 'release' && '--release' || '' }}
        run: |
          $extra = @(); if ($env:PROFILE_FLAG) { $extra = @($env:PROFILE_FLAG) }
          $out = Join-Path $env:RUNNER_TEMP 'card'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:SF_CARD_PREVIEW_DIR = $out
          $all = 'preparing,starting,retrying,opening'
          # Every look is a set of named settings; whatever is not named takes the default.
          $defaults = @{ theme='dark'; preset='sahel'; locale='en'; percents='34'; phases='preparing'; hints='0'; bench='0'; scale='1'; times=''; chips='none'; finish='0'; missing=''; tag='' }
          $looks = @(
            @{ percents='8'; times='0,300,700,1700' },
            @{ chips='none,hover-close,press-min' },
            @{ percents='99'; phases='opening'; finish='1' },
            @{ bench='60'; scale='1' },
            @{ bench='60'; scale='1.5' },
            @{ bench='60'; scale='2' }
          )
          foreach ($l in $looks) {
            $c = $defaults.Clone(); foreach ($k in $l.Keys) { $c[$k] = $l[$k] }
            $env:SF_CARD_THEME = $c.theme; $env:SF_CARD_PRESET = $c.preset; $env:SF_CARD_LOCALE = $c.locale
            $env:SF_CARD_PERCENTS = $c.percents; $env:SF_CARD_PHASES = $c.phases; $env:SF_CARD_HINT = $c.hints
            $env:SF_CARD_BENCH = $c.bench; $env:SF_CARD_SCALE = $c.scale; $env:SF_CARD_TIMES = $c.times
            $env:SF_CARD_CHIPS = $c.chips; $env:SF_CARD_FINISH = $c.finish; $env:SF_CARD_FONT_MISSING = $c.missing; $env:SF_CARD_TAG = $c.tag
            Write-Host "== $(($c.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ' ')"
            cargo test --manifest-path src-tauri/Cargo.toml --lib --locked @extra render_the_card_for_a_picture -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { Write-Host "render failed"; exit $LASTEXITCODE }
          }
          Get-ChildItem $out -Include *.bgra,*.txt -Recurse | ForEach-Object { Write-Host ("{0} {1}" -f $_.Name, $_.Length) }
      - name: Upload the pictures
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card/*.bgra
            ${{ runner.temp }}/card/*.txt
          retention-days: 7
